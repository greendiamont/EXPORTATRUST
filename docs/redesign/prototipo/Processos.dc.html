<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pedidos · ExportaTrust</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F4F6}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="min-height: 100vh; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #111827; background: #F3F4F6; font-size: 14px">

  <header style="background: #0F1B2D; color: #FFFFFF">
    <div style="max-width: 1320px; margin: 0 auto; box-sizing: border-box; padding: 0 24px; min-height: 56px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
      <div style="display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: 0.2px">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5FD3A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l6 6L21 6"></path></svg>
        ExportaTrust
      </div>
      <nav aria-label="Navegação principal" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1">
        <a href="Main.dc.html" style="min-height: 56px; display: inline-flex; align-items: center; padding: 0 14px; color: #C3CBD8; text-decoration: none">Painel</a>
        <a href="Processos.dc.html" aria-current="page" style="min-height: 56px; display: inline-flex; align-items: center; padding: 0 14px; color: #FFFFFF; text-decoration: none; font-weight: 500; box-shadow: inset 0 -3px 0 #5FD3A6">Pedidos</a>
        <a href="Cadastros.dc.html" style="min-height: 56px; display: inline-flex; align-items: center; padding: 0 14px; color: #C3CBD8; text-decoration: none">Cadastros</a>
        <a href="EUDR.dc.html" style="min-height: 56px; display: inline-flex; align-items: center; padding: 0 14px; color: #C3CBD8; text-decoration: none">EUDR</a>
        <a href="#" style="min-height: 56px; display: inline-flex; align-items: center; padding: 0 14px; color: #C3CBD8; text-decoration: none">Relatórios</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #C3CBD8">
        <span style="padding: 3px 8px; border: 1px solid #3A4A63; border-radius: 4px; font-size: 11px; letter-spacing: 0.6px">HOMOLOGAÇÃO</span>
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #2B3A52; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600">IV</span>
      </div>
    </div>
  </header>

  <main style="max-width: 1320px; margin: 0 auto; box-sizing: border-box; padding: 28px 24px 48px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600">Pedidos</h1>
      <a href="NovoProcesso.dc.html" style="min-height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 6px; background: #0F1B2D; color: #FFFFFF; font-weight: 500; text-decoration: none">+ Novo processo</a>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
      <div role="tablist" aria-label="Filtrar por fase" style="display: flex; flex-wrap: wrap; background: #FFFFFF; border: 1px solid #D1D5DB; border-radius: 6px; overflow: hidden">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
          <button role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
      <label style="display: flex; align-items: center; gap: 8px">
        <span style="position: absolute; left: -9999px">Buscar pedidos</span>
        <input placeholder="Buscar pedido, cliente ou contêiner" style="min-height: 38px; width: 300px; max-width: 100%; box-sizing: border-box; padding: 0 12px; border: 1px solid #D1D5DB; border-radius: 6px; font: inherit; background: #FFFFFF">
      </label>
    </div>

    <section aria-label="Lista de pedidos" style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 8px; overflow-x: auto">
      <table style="width: 100%; min-width: 1000px; border-collapse: collapse">
        <thead>
          <tr style="background: #F9FAFB; text-align: left; font-size: 12px; color: #6B7280; text-transform: uppercase; letter-spacing: 0.4px">
            <th style="padding: 11px 20px; font-weight: 500">Pedido</th>
            <th style="padding: 11px 12px; font-weight: 500">Cliente / destino</th>
            <th style="padding: 11px 12px; font-weight: 500">Andamento</th>
            <th style="padding: 11px 12px; font-weight: 500">Próximo passo</th>
            <th style="padding: 11px 12px; font-weight: 500">ETD</th>
            <th style="padding: 11px 12px; font-weight: 500; text-align: right">Valor</th>
            <th style="padding: 11px 20px; font-weight: 500">EUDR</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <tr style="border-top: 1px solid #F0F1F3">
              <td style="padding: 14px 20px; white-space: nowrap"><a href="Processo.dc.html" style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; text-decoration: none">{{r.ref}}</a><div style="font-size: 12px; color: #6B7280; margin-top: 2px">{{r.product}}</div></td>
              <td style="padding: 14px 12px">{{r.client}}<div style="font-size: 12px; color: #6B7280; margin-top: 2px">{{r.country}}</div></td>
              <td style="padding: 14px 12px; min-width: 190px">
                <div style="display: flex; gap: 3px" aria-hidden="true">
                  <sc-for list="{{r.segs}}" as="s" hint-placeholder-count="6"><span style="{{s}}"></span></sc-for>
                </div>
                <div style="font-size: 12px; color: #374151; margin-top: 6px">{{r.phaseLabel}}</div>
              </td>
              <td style="padding: 14px 12px">{{r.next}}<div style="{{r.dueStyle}}">{{r.due}}</div></td>
              <td style="padding: 14px 12px; white-space: nowrap">{{r.etd}}</td>
              <td style="padding: 14px 12px; text-align: right; font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{r.value}}</td>
              <td style="padding: 14px 20px; white-space: nowrap"><span style="{{r.eudrStyle}}">{{r.eudr}}</span></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { phase: 'Todos' }; }
  renderVals() {
    const NAMES = ['Pedido', 'Produção', 'Embarque', 'Documentos', 'Trânsito', 'Entregue'];
    const data = [
      { ref: 'GBU002/26', product: 'Wood pellets ENplus A1', client: '[CLIENTE]', country: 'Itália', p: 2, next: 'Conferir packing list', due: 'Hoje', tone: 'today', etd: '[DATA]', value: 'USD [VALOR]', e: 'pend' },
      { ref: '[REF]', product: '[PRODUTO]', client: '[CLIENTE]', country: 'Alemanha', p: 1, next: 'Cobrar PO assinado', due: 'Atrasado', tone: 'late', etd: '[DATA]', value: 'EUR [VALOR]', e: 'pend' },
      { ref: '[REF]', product: '[PRODUTO]', client: '[CLIENTE]', country: 'Estados Unidos', p: 0, next: 'Enviar pedido ao cliente', due: 'Amanhã', tone: 'soon', etd: '[DATA]', value: 'USD [VALOR]', e: 'na' },
      { ref: '[REF]', product: '[PRODUTO]', client: '[CLIENTE]', country: 'Holanda', p: 3, next: 'Emitir Commercial Invoice', due: 'Hoje', tone: 'today', etd: '[DATA]', value: 'EUR [VALOR]', e: 'ok' },
      { ref: '[REF]', product: '[PRODUTO]', client: '[CLIENTE]', country: 'Espanha', p: 4, next: 'Cobrar saldo', due: 'Em 3 dias', tone: 'soon', etd: '[DATA]', value: 'EUR [VALOR]', e: 'ok' },
      { ref: '[REF]', product: '[PRODUTO]', client: '[CLIENTE]', country: 'Reino Unido', p: 5, next: 'Concluído', due: '', tone: 'soon', etd: '[DATA]', value: 'GBP [VALOR]', e: 'na' },
    ];
    const opts = ['Todos', ...NAMES];
    const filters = opts.map((name) => {
      const on = this.state.phase === name;
      return { label: name, selected: on ? 'true' : 'false', pick: () => this.setState({ phase: name }),
        style: 'min-height: 38px; padding: 0 14px; border: 0; border-right: 1px solid #E5E7EB; font: inherit; font-size: 13px; cursor: pointer; background: ' + (on ? '#0F1B2D' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#374151') };
    });
    const badge = (bg, fg) => 'display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: ' + bg + '; color: ' + fg;
    const E = { ok: ['Completo', '#ECFDF5', '#047857'], pend: ['Pendente', '#FFFBEB', '#92400E'], na: ['N/A', '#F3F4F6', '#4B5563'] };
    const toneColor = { late: '#B91C1C', today: '#92400E', soon: '#6B7280' };
    const visible = this.state.phase === 'Todos' ? data : data.filter((d) => NAMES[d.p] === this.state.phase);
    const rows = visible.map((d) => ({ ...d,
      phaseLabel: (d.p + 1) + '/6 · ' + NAMES[d.p],
      segs: NAMES.map((_, i) => 'flex: 1; height: 6px; border-radius: 2px; background: ' + (i < d.p ? '#047857' : i === d.p ? (d.p === 5 ? '#047857' : '#F59E0B') : '#E5E7EB')),
      dueStyle: 'font-size: 12px; margin-top: 2px; font-weight: 600; color: ' + toneColor[d.tone],
      eudr: E[d.e][0], eudrStyle: badge(E[d.e][1], E[d.e][2]) }));
    return { filters, rows };
  }
}
</script>
</body>
</html>
